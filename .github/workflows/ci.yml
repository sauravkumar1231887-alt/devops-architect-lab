name: Building Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t building-platform:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: building-platform:${{ github.sha }}
          format: table
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag image
        if: github.event_name == 'push'
        run: docker tag building-platform:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/building-management-platform:${{ github.sha }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository_owner }}/building-management-platform:${{ github.sha }}

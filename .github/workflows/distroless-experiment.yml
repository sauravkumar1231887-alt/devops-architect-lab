
name: Distroless Experiment

on:
  push:
    branches:
      - experiment/distroless
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distroless-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build Distroless image
        run: |
          docker build \
            --file Dockerfile.distroless-test \
            --tag building-platform:distroless-test .

      - name: Verify non-root execution
        run: |
          USER_CONFIG=$(docker image inspect building-platform:distroless-test --format '{{.Config.User}}')
          echo "Configured container user: ${USER_CONFIG}"
          test -n "${USER_CONFIG}"
          test "${USER_CONFIG}" != "0"
          test "${USER_CONFIG}" != "0:0"

      - name: Start container
        run: |
          docker run -d \
            --name building-platform-test \
            -p 127.0.0.1:18080:8080 \
            building-platform:distroless-test

      - name: Verify health endpoint
        run: |
          for attempt in $(seq 1 15); do
            echo "Health check attempt ${attempt}/15"
            if curl --fail --silent \
              http://127.0.0.1:18080/health; then
              echo
              exit 0
            fi
            sleep 2
          done

          echo "Health endpoint did not become ready"
          docker logs building-platform-test
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs building-platform-test || true

      - name: Cleanup container
        if: always()
        run: docker rm -f building-platform-test || true

      - name: Generate full and fixable vulnerability reports
        if: always()
        run: |
          if ! docker image inspect building-platform:distroless-test >/dev/null 2>&1; then
            echo "Distroless image is unavailable; skipping scan."
            exit 0
          fi

          mkdir -p "${HOME}/.cache/trivy"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            aquasec/trivy:0.76.0 \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format table \
            --output /workspace/trivy-distroless-full.txt \
            building-platform:distroless-test

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            aquasec/trivy:0.76.0 \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --output /workspace/trivy-distroless-fixable.txt \
            building-platform:distroless-test

      - name: Enforce fixed HIGH/CRITICAL vulnerability policy
        if: always()
        run: |
          if ! docker image inspect building-platform:distroless-test >/dev/null 2>&1; then
            echo "Distroless image unavailable; security policy cannot be checked."
            exit 1
          fi

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.76.0 \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            building-platform:distroless-test

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distroless-vulnerability-reports
          path: |
            trivy-distroless-full.txt
            trivy-distroless-fixable.txt
          if-no-files-found: warn
          retention-days: 14

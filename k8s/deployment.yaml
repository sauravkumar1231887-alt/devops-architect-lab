
apiVersion: apps/v1
kind: Deployment
metadata:
  name: building-management-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: building-management-api
  template:
    metadata:
      labels:
        app: building-management-api
    spec:
      containers:
        - name: api
          image: ghcr.io/sauravkumar1231887-alt/building-management-platform:3fa8360621fb38f9085871e8e3c96c1cf5986d0b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: building-management-api
spec:
  type: ClusterIP
  selector:
    app: building-management-api
  ports:
    - port: 80
      targetPort: 8080
